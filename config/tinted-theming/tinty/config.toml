# Global settings
shell = "zsh -c '{}'"
default-scheme = "tinted8-github-dark-high-contrast"
default-cycle-ring = "default"

[[rings]]
name = "default"
schemes = [
  "tinted8-github-dark-high-contrast",
  "tinted8-github-light-high-contrast",
]

# Generated by colortemplate2tinty; cycle with `tinty cycle --ring solarized8`
[[rings]]
name = "solarized8"
schemes = [
  "tinted8-solarized8-dark",
  "tinted8-solarized8-light",
  "tinted8-solarized8-flat-dark",
  "tinted8-solarized8-flat-light",
  "tinted8-solarized8-high-dark",
  "tinted8-solarized8-high-light",
  "tinted8-solarized8-low-dark",
  "tinted8-solarized8-low-light",
  "base24-solarized8-dark",
  "base24-solarized8-light",
  "base16-solarized8-dark",
  "base16-solarized8-light",
]

[[schemes.extras]]
name = "tinted-colortemplate"
path = "https://github.com/jfishe/tinted-colortemplate"

[[items]]
name = "tinted-shell"
path = "https://github.com/tinted-theming/tinted-shell"
hook = ". %f"
supported-systems = ["base16", "base24", "tinted8"]
themes-dir = "scripts"

[[items]]
name = "tinted-dircolors"
path = "https://github.com/jfishe/tinted-dircolors"
themes-dir = "dircolors"
hook = "for d in \"$HOME\" ${USERPROFILE:+\"$USERPROFILE\"}; do cp -f %f \"$d/.dircolors\"; done"
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
name = "tinted-windows-terminal"
path = "https://github.com/jfishe/tinted-windows-terminal"
themes-dir = "themes"
hook = "python3 -I ~/.local/share/tinted-theming/tinty/repos/tinted-windows-terminal/apply-scheme.py %f"
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
name = "tinted-psreadline"
path = "https://github.com/jfishe/tinted-psreadline"
themes-dir = "psreadline"
hook = "for d in ${USERPROFILE:+\"$USERPROFILE/.config/tinted-theming\"}; do mkdir -p \"$d\" && cp -f %f \"$d/Profile.Tinty.ps1\"; done"
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
name = "tinted-delta"
path = "https://github.com/jfishe/tinted-delta"
themes-dir = "delta"
hook = "python3 -I ~/.local/share/tinted-theming/tinty/repos/tinted-delta/apply-delta.py %f ~/.config/delta/tinty.gitconfig ${USERPROFILE:+\"$USERPROFILE/.config/delta/tinty.gitconfig\"}"
supported-systems = ["base16", "base24", "tinted8"]
